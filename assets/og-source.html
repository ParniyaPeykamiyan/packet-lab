<html lang="en">

<title>Packet Lab preview</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root { --paper:#f3ead8; --ink:#1d1b18; --ink-2:#5d564b; --red:#c32f27; --blue:#1f3f8a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
  .env {
    position: absolute; inset: 0; padding: 26px;
    background: repeating-linear-gradient(-45deg,
      var(--red) 0 34px, var(--paper) 34px 48px, var(--blue) 48px 82px, var(--paper) 82px 96px);
  }
  .inner { position: relative; width: 100%; height: 100%; background: var(--paper); }
  .mono { font-family: "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .14em; }
  .par { position: absolute; left: 54px; top: 46px; font-size: 22px; color: var(--blue); font-weight: 500; }
  .par small { display: block; margin-top: 6px; font-size: 15px; color: var(--ink-2); font-weight: 400; }
  .stamp {
    position: absolute; right: 54px; top: 40px; width: 132px; height: 160px;
    border: 2px dashed var(--red); padding: 8px;
  }
  .stamp div { width: 100%; height: 100%; border: 1.5px solid var(--blue); display: grid; place-items: center; }
  .stamp span { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--ink-2); }
  .postmark { position: absolute; right: 158px; top: 104px; width: 300px; height: 150px; opacity: .88; }
  h1 {
    position: absolute; left: 0; right: 0; top: 232px; text-align: center;
    font-family: "Fraunces", serif; font-weight: 330; font-size: 92px; line-height: 1.02;
    letter-spacing: -0.02em; color: var(--ink); font-variation-settings: "opsz" 144;
  }
  h1 em { font-weight: 300; }
  .sub { position: absolute; left: 0; right: 0; top: 448px; text-align: center; font-size: 22px; color: var(--ink-2); }
  .flight { position: absolute; left: 40px; right: 120px; bottom: 26px; height: 70px; }
  .bird { position: absolute; right: 64px; bottom: 58px; }
</style>
</head>
